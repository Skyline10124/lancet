[workspace]
resolver = "3"
members = [
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Ast Rin"]

[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
tempfile = "3"
