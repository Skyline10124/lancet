[workspace]
resolver = "3"
members = [
    "crates/lancet-act",
    "crates/lancet-node",
    "crates/lancet-node/tests/fixtures/tool-probe",
    "crates/lancet-protocol",
    "crates/lancet-tool-decl",
    "tools/fs-edit",
    "tools/fs-list",
    "tools/fs-read",
    "tools/fs-search",
    "tools/fs-write",
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Ast Rin"]

[workspace.dependencies]
allocative = "0.3"
anyhow = "1"
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starlark = "=0.14.2"
starlark_syntax = "=0.14.2"
tempfile = "3"
toml = "1"
uuid = { version = "1", features = ["v4"] }
wasm-encoder = "=0.258.3"
wasmparser = "=0.258.3"
wasmtime = { version = "=49.0.5", default-features = false }
wit-bindgen = "0.60"
wit-component = "=0.258.3"
wit-parser = "=0.258.3"
